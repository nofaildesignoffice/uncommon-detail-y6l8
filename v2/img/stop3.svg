<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E3533"/><stop offset="1" stop-color="#132625"/></linearGradient></defs><style>
.a-fall{animation:fall 1.8s ease-in infinite}.d2{animation-delay:.6s}.d3{animation-delay:1.1s}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
.a-steam path{animation:st 2s ease-in-out infinite}.a-steam path:nth-child(2){animation-delay:.35s}.a-steam path:nth-child(3){animation-delay:.7s}
@keyframes st{0%{transform:translateY(4px);opacity:0}50%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
.a-spin{transform-origin:50px 57px;animation:sp 2.4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.a-rain path{animation:rn 1s linear infinite}.a-rain path:nth-child(2n){animation-delay:.4s}
@keyframes rn{0%{transform:translateY(-4px);opacity:0}40%{opacity:1}100%{transform:translateY(6px);opacity:0}}
.a-rub{animation:rb 1.2s ease-in-out infinite}@keyframes rb{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.a-crack{stroke-dasharray:30;animation:ck 2.4s ease-in-out infinite}@keyframes ck{0%{stroke-dashoffset:30}50%,100%{stroke-dashoffset:0}}
.a-float{animation:fl 3s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.a-grow{transform-origin:50px 86px;animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1.1)}}
.a-spark{animation:sk 1s steps(2) infinite}@keyframes sk{to{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="300" height="300" fill="url(#g)"/><g transform="translate(55.0 55.0) scale(1.9)" fill="none" stroke="#8FE3DF" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="14" width="56" height="72" rx="6"/><path d="M22 28h56"/><circle cx="34" cy="21" r="2"/><circle cx="44" cy="21" r="2"/>
<circle cx="50" cy="57" r="18"/><g class="a-spin"><path d="M50 45a12 12 0 1 1-11 7"/><path d="M36 48l3 4 4-2"/></g></g></svg>